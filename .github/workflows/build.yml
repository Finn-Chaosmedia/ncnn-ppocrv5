name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Download ncnn
      run: |
        wget https://github.com/Tencent/ncnn/releases/download/20260113/ncnn-20260113-android-vulkan.zip
        unzip ncnn-20260113-android-vulkan.zip -d app/src/main/jni/
        echo "ncnn_DIR set to: $(pwd)/app/src/main/jni/ncnn-20260113-android-vulkan"
    
    - name: Download OpenCV Mobile
      run: |
        wget https://github.com/nihui/opencv-mobile/releases/download/v35/opencv-mobile-3.4.20-android.zip
        unzip opencv-mobile-3.4.20-android.zip -d app/src/main/jni/
        echo "OpenCV_DIR set to: $(pwd)/app/src/main/jni/opencv-mobile-3.4.20-android"
    
    - name: Update CMakeLists.txt paths
      run: |
        cd app/src/main/jni
        # Backup original
        cp CMakeLists.txt CMakeLists.txt.backup
        # Update paths
        sed -i 's|/path/to/opencv-mobile-24.10-android|${CMAKE_CURRENT_SOURCE_DIR}/opencv-mobile-3.4.20-android|g' CMakeLists.txt
        sed -i 's|/path/to/ncnn-20250220-android-vulkan|${CMAKE_CURRENT_SOURCE_DIR}/ncnn-20260113-android-vulkan|g' CMakeLists.txt
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/